<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box;touch-action:none}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#32106d,#a331bd,#ff68b7);color:white;overflow:hidden}.top{text-align:center;padding:8px;font-size:24px;font-weight:bold}.levels{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.levels button,.actions button{border:0;border-radius:18px;padding:9px 15px;font-size:18px;font-weight:bold;background:white;color:#6c248d}.main{height:calc(100vh - 100px);display:flex;align-items:center;justify-content:center;gap:18px}.card{background:#fff;color:#54236d;border-radius:28px;padding:16px;box-shadow:0 8px 30px #19052d;width:min(70vw,850px);height:88%;position:relative}.chibis{width:210px;height:88%;background:#d99bf1;border:5px solid #fff;border-radius:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}.girl{width:135px;height:135px;border-radius:50%;background:#ffe0d6;border:8px solid #9c4bc2;position:relative}.girl:before{content:'';position:absolute;left:12px;top:-18px;width:95px;height:52px;border-radius:60% 60% 35% 35%;background:#7330a5}.girl:nth-child(2):before{background:#1e607a}.girl:nth-child(3):before{background:#e34f68}.girl:after{content:'• ᴗ •';position:absolute;left:28px;top:50px;font-size:27px;color:#572e68}.trace{height:78%;display:flex;justify-content:space-around;align-items:center}.letterBox{position:relative;width:46%;height:95%;border:3px dashed #dc9bea;border-radius:25px;background:#fff7ff}.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(42vh,310px);font-weight:bold;color:#eee;user-select:none}.draw{position:absolute;inset:0;width:100%;height:100%}.status{text-align:center;font-size:21px;font-weight:bold}.bar{height:15px;background:#eee;border-radius:10px;overflow:hidden;margin:5px 20px}.fill{height:100%;width:0;background:linear-gradient(90deg,#a94ae0,#ff4fa3);transition:.2s}.actions{text-align:center}.celebrate{display:none;position:fixed;inset:0;background:#511175e8;z-index:5;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:38px}.celebrate.show{display:flex}.stars{font-size:65px}</style></head><body><div class="top">💜 Traza las Letras KPop 💜<div class="levels" id="levels"></div></div><div class="main"><div class="chibis"><div class="girl"></div><div class="girl"></div><div class="girl"></div><b>✨ ¡Tú puedes! ✨</b></div><div class="card"><div class="trace"><div class="letterBox"><div class="guide" id="upper">L</div><canvas class="draw" id="c1"></canvas></div><div class="letterBox"><div class="guide" id="lower">l</div><canvas class="draw" id="c2"></canvas></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Sigue la forma de las letras con tu dedito 🌟</div><div class="actions"><button onclick="clearAll()">🧽 Borrar</button></div></div></div><div class="celebrate" id="win"><div class="stars">⭐⭐⭐</div><div id="msg"></div><button onclick="next()" style="margin-top:25px;padding:15px 30px;border:0;border-radius:25px;font-size:22px">Siguiente 💜</button></div><script>const pairs=['Ll','Dd','Nn','Ww','Cc','Rr','Pp','Qq','Vv'];const msgs=['¡L de LEGENDARIA! ¡Excelente trabajo!','¡D de DIVERTIDA! ¡Lo hiciste genial!','¡N de NOTABLE! ¡Qué bien trazaste!','¡W de WOW! ¡Eres una estrella!','¡C de CAMPEONA! ¡Fantástico!','¡R de RADIANTE! ¡Muy bien!','¡P de PERFECTO! ¡Sigue así!','¡Q de QUÉ INCREÍBLE! ¡Excelente!','¡V de VICTORIA! ¡Lo lograste!'];let idx=0,marks=[0,0],won=false;const lv=document.getElementById('levels');pairs.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p;b.onclick=()=>load(i);lv.appendChild(b)});function setup(id,k){let c=document.getElementById(id),x=c.getContext('2d'),down=false,last=null;function size(){c.width=c.clientWidth;c.height=c.clientHeight}size();addEventListener('resize',size);c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let q=pt(e);x.strokeStyle='#a83cce';x.lineWidth=18;x.lineCap='round';x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();last=q;marks[k]=Math.min(100,marks[k]+1.7);progress()};c.onpointerup=()=>down=false;function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}}setup('c1',0);setup('c2',1);function load(i){idx=i;won=false;document.getElementById('upper').textContent=pairs[i][0];document.getElementById('lower').textContent=pairs[i][1];clearAll();document.getElementById('win').classList.remove('show')}function clearAll(){['c1','c2'].forEach(id=>{let c=document.getElementById(id);c.getContext('2d').clearRect(0,0,c.width,c.height)});marks=[0,0];progress()}function progress(){let p=Math.round((marks[0]+marks[1])/2);document.getElementById('fill').style.width=Math.min(100,p)+'%';document.getElementById('status').textContent=p<35?'Sigue la forma de las letras con tu dedito 🌟':p<58?'¡Muy bien! Ya casi terminas 💜':'¡Excelente! ✨';if(marks[0]>=55&&marks[1]>=55&&!won)win()}function win(){won=true;let m=msgs[idx];document.getElementById('msg').textContent=m;document.getElementById('win').classList.add('show');try{if(window.AndroidTTS)AndroidTTS.speak(m);else speechSynthesis.speak(new SpeechSynthesisUtterance(m))}catch(e){}}function next(){load((idx+1)%pairs.length)}load(0);</script></body></html>
