<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box;touch-action:none}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#32106d,#a331bd,#ff68b7);color:#fff;overflow:hidden}.top{text-align:center;padding:8px;font-size:23px;font-weight:800}.levels{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.levels button,.actions button,.celebrate button{border:0;border-radius:18px;padding:9px 15px;font-size:18px;font-weight:700;background:#fff;color:#6c248d}.main{height:calc(100vh - 100px);display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 12px}.photoCard{width:250px;height:88%;background:#d99bf1;border:5px solid #fff;border-radius:30px;padding:9px;box-shadow:0 8px 30px #19052d;display:flex;flex-direction:column;gap:8px;justify-content:center}.photoCard img{display:block;width:100%;border-radius:20px;border:3px solid #fff;min-height:0}.photoCard .kid{height:58%;object-fit:cover}.photoCard .kpop{height:34%;object-fit:contain;background:#fff}.card{background:#fff;color:#54236d;border-radius:28px;padding:16px;box-shadow:0 8px 30px #19052d;width:min(70vw,850px);height:88%}.trace{height:78%;display:flex;justify-content:space-around;align-items:center}.letterBox{position:relative;width:46%;height:95%;border:3px dashed #dc9bea;border-radius:25px;background:#fff7ff}.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(42vh,310px);font-weight:800;color:#e8e8e8;user-select:none}.draw{position:absolute;inset:0;width:100%;height:100%}.status{text-align:center;font-size:21px;font-weight:700}.bar{height:15px;background:#eee;border-radius:10px;overflow:hidden;margin:5px 20px}.fill{height:100%;width:0;background:linear-gradient(90deg,#a94ae0,#ff4fa3);transition:.2s}.actions{text-align:center}.celebrate{display:none;position:fixed;inset:0;background:#511175ef;z-index:5;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:36px}.celebrate.show{display:flex}.celebrate img{width:min(330px,60vw);max-height:42vh;object-fit:contain;border-radius:24px;border:5px solid #fff;margin:10px;background:#fff}.stars{font-size:60px}</style></head><body><div class="top">💜 Traza las Letras KPop 💜<div class="levels" id="levels"></div></div><div class="main"><div class="photoCard"><img class="kid" alt="Foto" src="child.jpg"><img class="kpop" alt="KPop" src="kpop.jpg"></div><div class="card"><div class="trace"><div class="letterBox"><div class="guide" id="upper">L</div><canvas class="draw" id="c1"></canvas></div><div class="letterBox"><div class="guide" id="lower">l</div><canvas class="draw" id="c2"></canvas></div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Sigue la forma de las letras con tu dedito 🌟</div><div class="actions"><button onclick="clearAll()">🧽 Borrar</button></div></div></div><div class="celebrate" id="win"><div class="stars">⭐⭐⭐</div><img id="winImg" src="kpop.jpg" alt="KPop"><div id="msg"></div><button onclick="next()">Siguiente 💜</button></div><script>const pairs=['Ll','Dd','Nn','Ww','Cc','Rr','Pp','Qq','Vv'];const msgs=['¡L de LEGENDARIA! ¡Excelente trabajo!','¡D de DIVERTIDA! ¡Lo hiciste genial!','¡N de NOTABLE! ¡Qué bien trazaste!','¡W de WOW! ¡Eres una estrella!','¡C de CAMPEONA! ¡Fantástico!','¡R de RADIANTE! ¡Muy bien!','¡P de PERFECTO! ¡Sigue así!','¡Q de QUÉ INCREÍBLE! ¡Excelente!','¡V de VICTORIA! ¡Lo lograste!'];let idx=0,marks=[0,0],won=false;const lv=document.getElementById('levels'),upper=document.getElementById('upper'),lower=document.getElementById('lower'),fill=document.getElementById('fill'),status=document.getElementById('status'),win=document.getElementById('win'),msg=document.getElementById('msg');pairs.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p;b.onclick=()=>load(i);lv.appendChild(b)});function setup(id,k){let c=document.getElementById(id),x=c.getContext('2d'),down=false,last=null;function size(){c.width=c.clientWidth;c.height=c.clientHeight}size();addEventListener('resize',size);c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let q=pt(e);x.strokeStyle='#a83cce';x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(last.x,last.y);x.lineTo(q.x,q.y);x.stroke();last=q;marks[k]=Math.min(100,marks[k]+2.2);progress()};c.onpointerup=()=>down=false;function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}}setup('c1',0);setup('c2',1);function load(i){idx=i;won=false;upper.textContent=pairs[i][0];lower.textContent=pairs[i][1];clearAll();win.classList.remove('show')}function clearAll(){['c1','c2'].forEach(id=>{let c=document.getElementById(id);c.getContext('2d').clearRect(0,0,c.width,c.height)});marks=[0,0];progress()}function progress(){let p=Math.round((marks[0]+marks[1])/2);fill.style.width=Math.min(100,p)+'%';status.textContent=p<28?'Sigue la forma de las letras con tu dedito 🌟':p<45?'¡Muy bien! Ya casi terminas 💜':'¡Excelente! ✨';if(marks[0]>=42&&marks[1]>=42&&!won)showWin()}function showWin(){won=true;let m=msgs[idx];msg.textContent=m;win.classList.add('show');try{if(window.AndroidTTS)AndroidTTS.speak(m);else speechSynthesis.speak(new SpeechSynthesisUtterance(m))}catch(e){}}function next(){load((idx+1)%pairs.length)}load(0);</script></body></html>
