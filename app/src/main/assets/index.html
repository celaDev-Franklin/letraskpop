ction load(i){idx=i;won=false;upper.textContent=pairs[i][0];lower.textContent=pairs[i][1];clearAll();win.classList.remove('show')}function clearAll(){['c1','c2'].forEach(id=>{let c=document.getElementById(id);c.getContext('2d').clearRect(0,0,c.width,c.height)});marks=[0,0];progress()}function progress(){let p=Math.round((marks[0]+marks[1])/2);fill.style.width=Math.min(100,p)+'%';status.textContent=p<28?'Sigue la forma de las letras con tu dedito 🌟':p<45?'¡Muy bien! Ya casi terminas 💜':'¡Excelente! ✨';if(marks[0]>=42&&marks[1]>=42&&!won)showWin()}function showWin(){won=true;let m=msgs[idx];msg.textContent=m;win.classList.add('show');try{if(window.AndroidTTS)AndroidTTS.speak(m);else speechSynthesis.speak(new SpeechSynthesisUtterance(m))}catch(e){}}function next(){load((idx+1)%pairs.length)}load(0);</script></body></html>
